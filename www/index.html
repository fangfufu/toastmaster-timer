<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toastmasters Timer</title>
  <meta name="description"
    content="A professional countdown timer for Toastmasters sessions with full-screen color transitions.">
  <meta name="theme-color" content="#004165">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body id="body">
  <div id="app">
    <!-- Setup View -->
    <div id="setup-view">
      <h1>Toastmasters Timer</h1>
      <div id="slots-container" class="slots-container">
        <!-- Slots will be populated by JS -->
      </div>

      <div class="setup-actions">
        <div class="main-actions">
          <button id="add-slot-btn" class="secondary-btn">
            <i data-lucide="plus"></i> <span class="btn-text">Add</span>
          </button>
          <button id="delete-slot-btn" class="secondary-btn danger-btn" disabled>
            <i data-lucide="trash-2"></i> <span class="btn-text">Delete</span>
          </button>
          <button id="start-btn" disabled>
            <i data-lucide="play"></i> <span class="btn-text">Start</span>
          </button>
        </div>
        <div class="file-actions">
          <button id="save-btn" class="secondary-btn" title="Save">
            <i data-lucide="download"></i> <span class="btn-text">Save</span>
          </button>
          <label id="load-label" class="secondary-btn" title="Load">
            <i data-lucide="upload"></i> <span class="btn-text">Load</span>
            <input type="file" id="load-input" accept=".yaml,.yml" style="display: none;">
          </label>
          <button id="usage-btn" class="secondary-btn" title="Help">
            <i data-lucide="help-circle"></i> <span class="btn-text">Help</span>
          </button>
          <button id="theme-btn" class="secondary-btn" title="Toggle colour scheme">
            <i data-lucide="moon"></i>
          </button>
        </div>
      </div>
    </div>

    <template id="slot-template">
      <div class="slot-row" title="Click to select this slot">

        <div class="time-used-col">
          <span class="time-label time-used-label">Time used</span>
          <div class="progress-bg" title="Time used percentage against bell time">
            <div class="progress-fill"></div>
          </div>
        </div>

        <div class="slot-fields">
          <input type="text" class="slot-role" placeholder="Role">
          <input type="text" class="slot-name" placeholder="Name">

          <div class="slot-times">
            <div class="time-input-group">
              <span class="time-label" style="color: var(--tm-green)">Min</span>
              <div class="time-input-pair">
                <input type="text" class="min-mm" placeholder="MM">
                <span>:</span>
                <input type="text" class="min-ss" placeholder="SS">
              </div>
            </div>
            <div class="time-input-group">
              <span class="time-label" style="color: var(--tm-red)">Max</span>
              <div class="time-input-pair">
                <input type="text" class="max-mm" placeholder="MM">
                <span>:</span>
                <input type="text" class="max-ss" placeholder="SS">
              </div>
            </div>
          </div>
        </div>

      </div>
    </template>

    <!-- Timer View -->
    <div id="timer-view">
      <div id="timer-display">0:00</div>
      <div class="controls">
        <button id="reset-btn" class="icon-btn" title="Stop">
          <i data-lucide="square"></i>
        </button>
      </div>
    </div>

    <!-- Summary View -->
    <div id="summary-view">
      <h1>Session Summary</h1>
      <p class="subtitle">Total time taken for this segment</p>
      <div id="total-time-display">0:00</div>
      <button id="back-btn">
        <i data-lucide="arrow-left"></i> <span class="btn-text">Back to Setup</span>
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
    lucide.createIcons();
  </script>
</body>

</html>
