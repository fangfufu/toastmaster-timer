<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toastmasters Timer</title>
  <meta name="description" content="A professional countdown timer for Toastmasters sessions with full-screen color transitions.">
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="body">
  <div id="app">
    <!-- Setup View -->
    <div id="setup-view">
      <h1>Timer Setup</h1>
      <p class="subtitle">Set your target intervals for the session</p>
      
      <div id="slots-container" class="slots-container">
        <!-- Slots will be populated by JS -->
      </div>
      
      <div class="setup-actions">
        <div class="main-actions" style="display: flex; gap: 1rem;">
          <button id="add-slot-btn" class="secondary-btn" style="flex: 1;">
            <i data-lucide="plus"></i> Add Speaker Slot
          </button>
          <button id="start-btn" style="flex: 1;" disabled>Start Session</button>
        </div>
        <div class="file-actions" style="display: flex; gap: 1rem;">
          <button id="save-btn" class="secondary-btn" style="flex: 1;">
            <i data-lucide="download"></i> Save Session
          </button>
          <label id="load-label" class="secondary-btn" style="flex: 1; margin: 0; cursor: pointer;">
            <i data-lucide="upload"></i> Load Session
            <input type="file" id="load-input" accept=".yaml,.yml" style="display: none;">
          </label>
        </div>
      </div>
    </div>

    <template id="slot-template">
      <div class="slot-row">
        <label class="radio-label" title="Select to start timer for this slot">
          <input type="radio" name="selected-slot" class="slot-radio">
          <span class="custom-radio"></span>
        </label>
        
        <div class="slot-fields">
          <input type="text" class="slot-role" placeholder="Role">
          <input type="text" class="slot-name" placeholder="Name">
          
          <div class="slot-times">
            <div class="time-input-group">
              <span class="time-label" style="color: var(--tm-green)">Min</span>
              <div class="time-input-pair">
                <input type="text" class="min-mm" placeholder="MM">
                <span>:</span>
                <input type="text" class="min-ss" placeholder="SS">
              </div>
            </div>
            <div class="time-input-group">
              <span class="time-label" style="color: var(--tm-red)">Max</span>
              <div class="time-input-pair">
                <input type="text" class="max-mm" placeholder="MM">
                <span>:</span>
                <input type="text" class="max-ss" placeholder="SS">
              </div>
            </div>
          </div>
        </div>
        
        <button class="icon-btn delete-btn" title="Remove Slot">
          <i data-lucide="trash-2"></i>
        </button>
      </div>
    </template>

    <!-- Timer View -->
    <div id="timer-view">
      <div id="timer-display">0:00</div>
      <div class="controls">
        <button id="reset-btn" class="icon-btn" title="Stop & Reset">
          <i data-lucide="square"></i>
        </button>
      </div>
    </div>

    <!-- Summary View -->
    <div id="summary-view">
      <h1>Session Summary</h1>
      <p class="subtitle">Total time taken for this segment</p>
      <div id="total-time-display">0:00</div>
      <button id="back-btn">Back to Setup</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
