<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toastmasters Timer</title>
  <meta name="description" content="A professional countdown timer for Toastmasters sessions with full-screen color transitions.">
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="body">
  <div id="app">
    <!-- Setup View -->
    <div id="setup-view">
      <h1>Timer Setup</h1>
      <p class="subtitle">Set your target intervals for the session</p>
      
      <div class="input-group">
        <label>Time Thresholds (Minutes:Seconds)</label>
        <div class="inputs-row centered-thresholds">
          <div class="threshold-col">
            <label style="color: var(--tm-green)">Minimum Time</label>
            <div class="time-input-pair">
              <input type="text" id="min-mm" placeholder="MM" value="5">
              <span>:</span>
              <input type="text" id="min-ss" placeholder="SS" value="00">
            </div>
          </div>
          <div class="threshold-col">
            <label style="color: var(--tm-red)">Maximum Time</label>
            <div class="time-input-pair">
              <input type="text" id="max-mm" placeholder="MM" value="7">
              <span>:</span>
              <input type="text" id="max-ss" placeholder="SS" value="00">
            </div>
          </div>
        </div>
      </div>
      
      <button id="start-btn">Start Session</button>
    </div>

    <!-- Timer View -->
    <div id="timer-view">
      <div id="timer-display">0:00</div>
      <div class="controls">
        <button id="reset-btn" class="icon-btn" title="Stop & Reset">
          <i data-lucide="square"></i>
        </button>
      </div>
    </div>

    <!-- Summary View -->
    <div id="summary-view">
      <h1>Session Summary</h1>
      <p class="subtitle">Total time taken for this segment</p>
      <div id="total-time-display">0:00</div>
      <button id="back-btn">Back to Setup</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
