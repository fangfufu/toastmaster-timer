<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toastmasters Timer</title>
  <meta name="description" content="A professional countdown timer for Toastmasters sessions with full-screen color transitions.">
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="body">
  <div id="app">
    <!-- Setup View -->
    <div id="setup-view">
      <h1>Timer Setup</h1>
      <p class="subtitle">Set your target intervals for the session</p>
      
      <div class="input-group">
        <label>Time Thresholds (Minutes:Seconds)</label>
        <div class="inputs-row">
          <div>
            <label for="green-time" style="color: var(--tm-green)">Green</label>
            <input type="text" id="green-time" placeholder="5:00" value="5:00">
          </div>
          <div>
            <label for="amber-time" style="color: var(--tm-amber)">Amber</label>
            <input type="text" id="amber-time" placeholder="6:00" value="6:00">
          </div>
          <div>
            <label for="red-time" style="color: var(--tm-red)">Red</label>
            <input type="text" id="red-time" placeholder="7:00" value="7:00">
          </div>
          <div>
            <label for="bell-time" style="color: var(--text-primary)">Bell</label>
            <input type="text" id="bell-time" placeholder="7:30" value="7:30">
          </div>
        </div>
      </div>
      
      <button id="start-btn">Start Session</button>
    </div>

    <!-- Timer View -->
    <div id="timer-view">
      <div id="timer-display">0:00</div>
      <div class="controls">
        <button id="reset-btn" class="icon-btn" title="Stop & Reset">
          <i data-lucide="square"></i>
        </button>
      </div>
    </div>

    <!-- Summary View -->
    <div id="summary-view">
      <h1>Session Summary</h1>
      <p class="subtitle">Total time taken for this segment</p>
      <div id="total-time-display">0:00</div>
      <button id="back-btn">Back to Setup</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
